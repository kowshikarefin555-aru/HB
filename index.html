<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Ultra-Premium Dream Wish</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Comfortaa:wght@700&family=Poppins:wght@800;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #04010a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Hind Siliguri', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* প্রিমিয়াম ডাইনামিক ক্যানভাস */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* মহাজাগতিক গ্লো ভাইব */
        .cosmic-glow {
            position: absolute;
            width: 140%;
            height: 80%;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.25) 0%, rgba(139, 92, 246, 0.15) 50%, transparent 100%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(70px);
            z-index: 2;
            pointer-events: none;
        }

        /* --- স্টেজ ১: দ্য ম্যাজিক্যাল ক্রিস্টাল হার্ট --- */
        .stage-trigger {
            position: absolute;
            z-index: 10;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .crystal-heart {
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            font-size: 4.5rem;
            filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.8));
            animation: heartFloat 3s ease-in-out infinite;
        }

        /* হার্টের চারপাশের অরবিট রিং */
        .heart-orbit {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px dashed rgba(236, 72, 153, 0.4);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        .trigger-text {
            color: #ffffff;
            margin-top: 30px;
            font-size: 0.95rem;
            font-family: 'Comfortaa', cursive;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(236, 72, 153, 0.6);
            animation: textPulse 1.5s infinite alternate;
        }

        /* --- স্টেজ ২: সুপার সিনেমাটিক কাউন্টডাউন --- */
        .stage-countdown {
            position: absolute;
            z-index: 9;
            display: none;
            text-align: center;
            width: 100%;
        }

        .countdown-number {
            font-size: 9rem;
            font-weight: 900;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffffff 20%, #ff758c 60%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 35px rgba(236, 72, 153, 0.6));
            opacity: 0;
        }

        .count-animation {
            animation: cinematicPop 1s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
        }

        /* --- স্টেজ ৩: আল্ট্রা-লাক্সারি গ্লাস উইশ কার্ড --- */
        .stage-card {
            position: relative;
            z-index: 5;
            width: 88%;
            max-width: 350px; /* মোবাইল ফ্রেন্ডলি সাইজ */
            transform: scale(0.7) translateY(60px);
            opacity: 0;
            visibility: hidden;
            transition: all 1.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .stage-card.reveal {
            transform: scale(1) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .card {
            background: rgba(15, 8, 25, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 40px 25px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7);
            position: relative;
            overflow: hidden;
        }

        /* আরজিবি গ্লোয়িং লাইভ বর্ডার ইফেক্ট */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 28px;
            padding: 2px; /* বর্ডারের পুরুত্ব */
            background: linear-gradient(gradient-angle, #ff758c, #8b5cf6, #3b82f6, #ff758c);
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            animation: rotateGlow 5s linear infinite;
        }

        .decor-star {
            font-size: 2rem;
            margin-bottom: 15px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        .main-title {
            font-size: 2.3rem;
            font-weight: 900;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(45deg, #fff, #ff7eb3, #ffe3ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .name-container {
            margin: 25px 0;
        }

        /* লিকুইড শিমার প্রিমিয়াম নাম */
        .name {
            font-size: 3.2rem;
            font-weight: 900;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(90deg, #ff758c, #ffffff, #8b5cf6, #ffffff, #ff758c);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            display: inline-block;
            animation: shineText 4s linear infinite;
            filter: drop-shadow(0 0 20px rgba(255, 117, 140, 0.6));
        }

        .message-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 22px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .greetings {
            font-size: 1.25rem;
            color: #ff7eb3;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .dua {
            font-size: 1.05rem;
            color: #e2e8f0;
            line-height: 1.9;
            font-weight: 500;
            text-align: justify;
            text-align-last: center;
        }

        /* --- সমস্ত অ্যানিমেশন কোড --- */
        @keyframes heartFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes textPulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        @keyframes cinematicPop {
            0% { transform: scale(0.3); opacity: 0; filter: blur(10px); }
            45% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            100% { transform: scale(1.3); opacity: 0; filter: blur(15px); }
        }

        @keyframes rotateGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes shineText {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <div class="cosmic-glow"></div>
    <canvas id="sparkleCanvas"></canvas>

    <!-- স্টেজ ১: ক্রিস্টাল হার্ট এন্ট্রি -->
    <div class="stage-trigger" id="stageTrigger" onclick="triggerDreamSequence()">
        <div class="heart-orbit"></div>
        <div class="crystal-heart">💖</div>
        <div class="trigger-text">PLEASE CLICK IT</div>
    </div>

    <!-- স্টেজ ২: মেগা পার্টিকেল কাউন্টডাউন -->
    <div class="stage-countdown" id="stageCountdown">
        <div class="countdown-number" id="countdownNumber">10</div>
    </div>

    <!-- স্টেজ ৩: আল্ট্রা-লাক্সারি উইশ কার্ড -->
    <div class="stage-card" id="stageCard">
        <div class="card">
            <span class="decor-star">✨🎉✨</span>
            <h1 class="main-title">Happy Birthday</h1>
            
            <div class="name-container">
                <div class="name">PAPIYA</div>
            </div>

            <div class="message-box">
                <p class="greetings">অনেক অনেক শুভেচ্ছা🥰</p>
                <p class="dua">
                    আল্লাহ তোমাকে সামনের দিনগুলোতে ভালো রাখুক। আল্লাহ তোমার সব স্বপ্নগুলো পূরণ করার তৌফিক দান করুন। দোয়া করি জীবনে অনেক এগিয়ে যাও।
                </p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sparkleCanvas');
        const ctx = canvas.getContext('2d');
        let magicalParticles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // প্রিমিয়াম নিয়ন স্টার ও গ্লিটার কণা
        class MagicalParticle {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.isExplosion = isExplosion;
                this.radius = isExplosion ? Math.random() * 3 + 1.5 : Math.random() * 2 + 0.5;
                this.vx = isExplosion ? (Math.random() - 0.5) * 7 : (Math.random() - 0.5) * 1.5;
                this.vy = isExplosion ? (Math.random() - 0.5) * 7 : -(Math.random() * 1.2 + 0.3);
                this.alpha = 1;
                this.color = Math.random() > 0.4 ? '#ff758c' : '#8b5cf6';
                this.decay = isExplosion ? 0.015 : 0.004;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = this.isExplosion ? 18 : 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
        }

        // অনবরত মৃদু ব্যাকগ্রাউন্ড স্পার্কল জেনারেট করা
        setInterval(() => {
            if(magicalParticles.length < 70) {
                magicalParticles.push(new MagicalParticle(Math.random() * canvas.width, canvas.height + 10, false));
            }
        }, 120);

        function renderMagic() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            magicalParticles.forEach((p, index) => {
                p.update();
                p.draw();
                if(p.alpha <= 0) magicalParticles.splice(index, 1);
            });
            requestAnimationFrame(renderMagic);
        }
        requestAnimationFrame(renderMagic);

        // সিকোয়েন্স চালনাকারী
        function triggerDreamSequence() {
            const trigger = document.getElementById('stageTrigger');
            trigger.style.opacity = '0';
            trigger.style.transform = 'scale(0.4)';
            setTimeout(() => trigger.style.display = 'none', 800);

            setTimeout(() => {
                document.getElementById('stageCountdown').style.display = 'block';
                runCinematicCount(10);
            }, 800);
        }

        function runCinematicCount(count) {
            const numElement = document.getElementById('countdownNumber');
            
            if (count >= 0) {
                numElement.innerText = count;
                numElement.classList.remove('count-animation');
                void numElement.offsetWidth; // রিফ্লো ট্রিগার
                numElement.classList.add('count-animation');

                // প্রতি কাউন্টে নিয়ন কণার বিস্ফোরণ
                for(let i=0; i<12; i++) {
                    magicalParticles.push(new MagicalParticle(canvas.width / 2, canvas.height / 2, true));
                }

                setTimeout(() => runCinematicCount(count - 1), 1000);
            } else {
                document.getElementById('stageCountdown').style.display = 'none';
                
                // ফাইনাল গ্র্যান্ড সেলিব্রেশন বার্স্ট
                for(let i=0; i<60; i++) {
                    magicalParticles.push(new MagicalParticle(canvas.width / 2, canvas.height / 2, true));
                }

                setTimeout(() => {
                    document.getElementById('stageCard').classList.add('reveal');
                }, 300);
            }
        }
    </script>
</body>
</html>
